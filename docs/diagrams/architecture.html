<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florecer — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Florecer — gamified savings</h1>
    <p class="sub">React SPA + Hono BFF. Supabase owns auth+data with RLS; Firefly III holds the financial truth; R2 stores assets; achievements share anonymized.</p>

    <svg viewBox="0 0 1100 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-title fl-desc">
      <title id="fl-title">Florecer: frontend a servicios</title>
      <desc id="fl-desc">frontend/ es React + TS + Tailwind + shadcn con capas ui/molecules/organisms/pages y TanStack Query; el BFF Hono orquesta Supabase (JWT + RLS), Firefly III self-hosted, Cloudflare R2, Satori para share cards y Vertex AI Imagen para avatares; XP, streaks, cosmetics e Impulse Swap viven del lado del producto.</desc>
      <defs>
        <marker id="fl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="fl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="490" fill="#f5f5f5"/>

      <!-- frontend -->
      <rect x="40" y="60" width="320" height="260" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="200" y="84" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FRONTEND/ — REACT + TS + VITE</text>
      <g font-family="'Geist Mono', monospace" font-size="9.5">
        <rect x="60" y="100" width="280" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="200" y="121" fill="#2d3142" text-anchor="middle">components/ui — Button, Toast, Avatar…</text>
        <rect x="60" y="140" width="280" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="200" y="161" fill="#2d3142" text-anchor="middle">molecules — XPBar, StreakBadge, MoodBar</text>
        <rect x="60" y="180" width="280" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="200" y="201" fill="#2d3142" text-anchor="middle">organisms — VisionBoard, ImpulseSwap</text>
        <rect x="60" y="220" width="280" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="200" y="241" fill="#2d3142" text-anchor="middle">pages — Dashboard, Wardrobe, Onboarding</text>
        <rect x="60" y="260" width="280" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="200" y="281" fill="#2d3142" text-anchor="middle">TanStack Query — estado del server</text>
      </g>
      <text x="200" y="312" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">PIXEL_ART_GUIDE — estetica del avatar</text>

      <!-- BFF -->
      <rect x="430" y="140" width="200" height="100" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="530" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hono BFF</text>
      <text x="530" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orquesta backend</text>
      <text x="530" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JWT verify</text>
      <text x="530" y="226" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">share cards solo % — sin montos</text>

      <!-- services -->
      <rect x="700" y="60" width="360" height="260" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="880" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICIOS</text>
      <g font-family="'Geist Mono', monospace" font-size="9.5">
        <rect x="720" y="100" width="320" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="880" y="123" fill="#2d3142" text-anchor="middle">Supabase — Auth JWT + DB + RLS</text>
        <rect x="720" y="144" width="320" height="36" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.9"/><text x="880" y="167" fill="#2d3142" text-anchor="middle">Firefly III — self-hosted, verdad financiera</text>
        <rect x="720" y="188" width="320" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="880" y="211" fill="#2d3142" text-anchor="middle">Cloudflare R2 — assets/cosmetics</text>
        <rect x="720" y="232" width="155" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="797" y="255" fill="#2d3142" text-anchor="middle">Satori — cards</text>
        <rect x="885" y="232" width="155" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="962" y="255" fill="#2d3142" text-anchor="middle">Vertex Imagen</text>
      </g>
      <text x="880" y="296" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">avatar companion + unlockables</text>

      <!-- edges -->
      <path d="M 360 190 L 430 190" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#fl-arrow-accent)"/>
      <path d="M 630 170 L 700 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <path d="M 630 190 L 700 185" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <path d="M 630 215 L 700 230" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>

      <!-- gamification -->
      <rect x="40" y="350" width="1020" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loop: deposito → XP + streak → mood del companion → cosmetic unlock → share anonimo</text>
      <text x="550" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Impulse Swap: un tap convierte gasto impulsivo en deposito</text>
      <text x="550" y="410" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">ARCHITECTURE.md tiene el detalle de data flows</text>
    </svg>
  </div>
</body>
</html>
